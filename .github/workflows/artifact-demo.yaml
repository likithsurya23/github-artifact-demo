name: Artifact Upload and Download

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # JOB 1: Create and Upload Artifact
  upload-job:
    name: Create and Upload Text File
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Text File
        run: |
          echo "Hello from Job 1" > output.txt
          echo "This file is uploaded as an artifact." >> output.txt

      - name: Display File Content
        run: cat output.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: text-file-artifact
          path: output.txt

  # JOB 2: Download and Read Artifact
  download-job:
    name: Download and Print Text File
    runs-on: ubuntu-latest
    needs: upload-job

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: text-file-artifact
          path: downloaded-file

      - name: Display Downloaded File
        run: |
          echo "Artifact downloaded successfully!"
          cat downloaded-file/output.txt
